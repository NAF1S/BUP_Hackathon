[pytest]
testpaths = tests
# `-p no:faulthandler`: on Windows, CPython can raise a benign access violation
# while tearing down threads at interpreter exit (starlette's TestClient uses an
# anyio portal thread). faulthandler then prints a frightening native traceback
# even though the run passed and exited 0. The exit code stays authoritative, so
# the dump is pure noise for anyone running this suite.
addopts = -q --strict-markers -p no:faulthandler
filterwarnings =
    error::DeprecationWarning:app.*
